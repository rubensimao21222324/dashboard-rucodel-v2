<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b10">
<title>Fluxo de Produção · Rucodel</title>
<style>
:root{--bg:#090b10;--panel:#11141b;--panel2:#171b24;--line:#ffffff12;--ink:#ece8df;--muted:#8f929c;--gold:#ddbd80;
  --late:#ff6b5e;--today:#ff9f43;--tomorrow:#f5c542;--ok:#4fd39a;--block:#c084fc;--font:'Segoe UI',Inter,system-ui,sans-serif}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px var(--font);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;flex-direction:column}.brand small{font-size:10px;letter-spacing:.3em;color:var(--gold);font-weight:700}.brand b{font-size:22px;font-weight:600}
.test{background:#3a2d12;border:1px solid #f5c54255;color:#f5d27a;border-radius:10px;padding:6px 12px;font-size:13px;font-weight:600}
.spacer{flex:1}
.search{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;width:200px;outline:none}
.search:focus{border-color:#ddbd8077}
.who{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:4px 6px 4px 12px;font-size:13px;color:var(--muted)}
.who select{background:none;border:0;color:var(--ink);font-weight:600;padding:6px;outline:none}
.who select option{background:var(--panel2)}
.btn{border:1px solid #ddbd8055;background:none;color:var(--gold);padding:10px 14px;border-radius:12px;cursor:pointer;text-decoration:none;font-size:14px;white-space:nowrap}
.btn.gold{background:var(--gold);color:#1d1c16;border-color:var(--gold);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;padding:12px 20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-width:0}
.kpi .v{font-size:28px;font-weight:300;line-height:1.1}.kpi .l{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.late .v{color:var(--late)}.kpi.block .v{color:var(--block)}.kpi.ok .v{color:var(--ok)}.kpi.gold .v{color:var(--gold)}
.kpi .v small{font-size:14px;color:var(--muted);margin-left:4px}
.board{flex:1;min-height:0;display:flex;gap:12px;padding:4px 20px 18px;overflow-x:auto;overflow-y:hidden;scroll-behavior:smooth}
.col{flex:0 0 268px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:16px;min-height:0;transition:border-color .15s,background .15s}
.col.over{border-color:var(--gold);background:#1a1912}
.col.block-col{border-color:#c084fc33}
.colhead{padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.colhead .t{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.colhead .t i{font-style:normal;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;background:#ffffff0d;color:var(--muted)}
.colhead .t .n{margin-left:auto;background:#ffffff10;border-radius:20px;padding:2px 9px;font-size:13px}
.colhead .s{font-size:12px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between}
.cards{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:9px;scrollbar-width:thin;scrollbar-color:#ffffff20 transparent}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:18px 6px;border:1px dashed #ffffff18;border-radius:12px}
.card{position:relative;background:var(--panel2);border:1px solid #ffffff10;border-left:5px solid var(--muted);border-radius:12px;padding:10px 12px 10px 12px;cursor:grab;touch-action:pan-y;transition:transform .12s,box-shadow .12s}
.card:active{cursor:grabbing}
.card.p-late{border-left-color:var(--late)}.card.p-today{border-left-color:var(--today)}.card.p-tomorrow{border-left-color:var(--tomorrow)}.card.p-normal{border-left-color:#4b5263}
.card .r1{display:flex;align-items:baseline;gap:8px}.card .num{font-weight:700;font-size:16px}.card .cli{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.card .r2{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px}
.card .qty{font-size:20px;font-weight:600}.card .qty small{font-size:13px;color:var(--muted);font-weight:400}
.card .ref{margin-left:auto;font-family:ui-monospace,Consolas,monospace;font-size:12px;background:#ffffff0c;border-radius:6px;padding:2px 6px;color:#cfd2da}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:#ffffff0d;color:#c9ccd4}
.tag.Pintura{background:#ff9f4322;color:#ffb877}.tag.Maquinada{background:#4fb4ff22;color:#8ccdff}.tag.Solda{background:#ff6b5e22;color:#ff9e95}.tag.Desempeno{background:#4fd39a22;color:#86e3b9}
.card .r3{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--muted)}
.card .due.late{color:var(--late);font-weight:700}.card .due.today{color:var(--today);font-weight:700}.card .due.tomorrow{color:var(--tomorrow);font-weight:600}
.card .age.slow{color:var(--today)}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:rotate(2.5deg) scale(1.03);box-shadow:0 18px 50px #000c;opacity:.95;width:244px}
.card.dragging{opacity:.25}
dialog{background:#12151d;color:var(--ink);border:1px solid #ddbd8044;border-radius:20px;padding:0;width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:#000b}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.dh h3{margin:0;font-size:22px}.dh small{display:block;color:var(--muted);font-size:13px;margin-top:4px;font-weight:400}
.x{background:#ffffff0d;border:0;border-radius:10px;width:40px;height:40px;font-size:18px;cursor:pointer;flex:none}
.db{padding:16px 22px 20px;overflow:auto;max-height:calc(100vh - 160px)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;font-size:14px}.grid2 span{color:var(--muted);font-size:12px;display:block}
.photos{display:flex;gap:8px;margin:12px 0}.photos div{width:96px;height:96px;border-radius:12px;background:#0b0d12 center/cover;border:1px solid var(--line);display:grid;place-items:center;color:#3c4150;font-size:30px}
h4{margin:18px 0 8px;font-size:12px;letter-spacing:.1em;color:var(--muted);font-weight:600}
.obs{background:#ffffff08;border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.45;white-space:pre-wrap}
.hist{display:flex;flex-direction:column;gap:0}.hist div{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}.hist time{color:var(--muted)}
.moves{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.moves button{border:1px solid #ffffff22;background:#ffffff08;border-radius:10px;padding:10px 12px;cursor:pointer;font-size:13px}
.moves button.next{background:var(--gold);color:#1d1c16;border-color:var(--gold);font-weight:700}
.confirm .db p{font-size:17px;line-height:1.5;margin:0 0 6px}.confirm .db p b{color:var(--gold)}
.row{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.row .btn{padding:14px 22px;font-size:16px}
textarea.note{width:100%;min-height:60px;background:#0b0d12;border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px;outline:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1c2230;border:1px solid #ddbd8055;border-radius:12px;padding:12px 18px;z-index:60;font-size:14px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.search{width:130px}.col{flex-basis:84vw}}
/* Página inteira com scroll: as colunas mostram todos os cartões e a página desce; a faixa das colunas desliza para o lado. */
html,body{height:auto;min-height:100%}body{overflow-x:hidden;overflow-y:auto}
.board{flex:none;overflow-y:visible;align-items:flex-start}
.col{min-height:auto}.cards{flex:none;overflow-y:visible}
.card{touch-action:pan-x pan-y}
</style>
</head>
<body>
<header>
  <div class="brand"><small>RUCODEL · JARVIS</small><b>Fluxo de Produção</b></div>
  <span class="test" title="Dados fictícios, guardados só neste aparelho. Nada é enviado ao programa de gestão.">MODO TESTE · dados fictícios</span>
  <span class="spacer"></span>
  <input class="search" id="q" placeholder="🔎 Nº cliente / obra" inputmode="numeric" autocomplete="off">
  <label class="who">Quem está a usar <select id="user"></select></label>
  <button class="btn" id="reset" type="button" title="Volta a gerar os dados de teste">↺ Repor teste</button>
  <a class="btn" href="/producao/ecra">Produção</a>
</header>
<section class="kpis" id="kpis"></section>
<main class="board" id="board"></main>
<dialog id="detail"></dialog>
<dialog id="confirm" class="confirm"></dialog>
<div class="toast" id="toast" hidden></div>
<script>
'use strict';
// ─── Fluxo de Produção — MODO TESTE ───────────────────────────────────────────────────────────────
// Dados fictícios guardados só neste navegador (localStorage). Não fala com o programa de gestão.
// Quando for validado, a mesma página passa a ler/gravar no Jarvis (com confirmação em cada movimento).
const COLS=[
  {id:'triagem',  t:'Recebidas / triagem',      i:'1'},
  {id:'decapar',  t:'A decapar',                i:'2'},
  {id:'reparacao',t:'Reparação',  s:'solda · desempeno · preparação', i:'3'},
  {id:'cnc',      t:'CNC / maquinagem',         i:'4'},
  {id:'pintura',  t:'Pintura',                  i:'5'},
  {id:'forno',    t:'Forno / cura',             i:'6'},
  {id:'qualidade',t:'Controlo de qualidade',    i:'7'},
  {id:'prontas',  t:'Prontas para expedição',   i:'✓'},
  {id:'bloqueadas',t:'Problemas / bloqueadas',  i:'!'},
];
const FLOW=COLS.map(c=>c.id).filter(id=>id!=='bloqueadas');
const USERS=['Simão','Encarregado','Torres','Bruno','João','Bruno Urrice','Nuno'];
const KEY='rucodel-fluxo-teste-v1',UKEY='rucodel-fluxo-utilizador';
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e;};
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let S=store.get(KEY)||null,query='';

// ─── dados de teste (fictícios) ───
function seed(){
  const now=Date.now(),H=36e5,D=864e5,rnd=n=>Math.floor(Math.random()*n),pick=a=>a[rnd(a.length)];
  const clientes=['Auto Norte Lda','Pneus & Cia','Oficina Silva','Garagem Central','MotorSport Braga','Stand Litoral','Carros do Vale','Rent Porto','Particular','Frota Express','AutoPremium','Oficina Ribeiro'];
  const tipos=[['Pintura'],['Maquinada'],['Pintura','Solda'],['Maquinada','Desempeno'],['Pintura','Desempeno'],['Solda','Desempeno','Pintura'],['Maquinada','Solda']];
  const cores=['Preto brilho','Cinza grafite','Prata','Preto mate','Branco','Bronze','Antracite'];
  const obs=['','Cliente pede cor igual à original.','Fissura de ~4 cm no aro interior.','Empeno lateral ligeiro.','Atenção: jante bipartida, desmontar com cuidado.','Urgente — carro parado.','Parafusos para cromar.'];
  const letters='ABCDEFGHJKLMNPRSTUVXZ',L=()=>letters[rnd(letters.length)]+letters[rnd(letters.length)];
  const items=[];let num=4100;
  const weights={triagem:4,decapar:4,reparacao:4,cnc:4,pintura:5,forno:3,qualidade:3,prontas:4,bloqueadas:2};
  Object.entries(weights).forEach(([col,n])=>{for(let k=0;k<n;k++){
    const entered=now-(rnd(30)+1)*H*(col==='bloqueadas'?3:1)-rnd(60)*6e4;
    const flowIdx=col==='bloqueadas'?rnd(5):FLOW.indexOf(col);
    const hist=[];let t=entered-flowIdx*(2+rnd(6))*H;
    for(let s=0;s<=flowIdx;s++){hist.push({para:FLOW[s],de:s?FLOW[s-1]:null,quando:t,quem:s?pick(USERS):'Simão'});t+=(1+rnd(6))*H;}
    if(col==='bloqueadas')hist.push({para:'bloqueadas',de:FLOW[flowIdx],quando:entered,quem:pick(USERS),nota:pick(['Falta tinta da cor pedida.','Fissura maior do que parecia — falar com o cliente.','À espera de aprovação de orçamento.'])});
    else hist[hist.length-1].quando=entered;
    items.push({id:'t'+(++num),obra:String(num),cliente:String(1000+rnd(3000)),nome:pick(clientes),ref:L()+'-'+String(rnd(100)).padStart(2,'0')+'-'+L(),
      qtd:pick([1,2,2,4,4,4,4,5]),medida:pick([15,16,17,17,18,18,19,19,20,21]),tipos:pick(tipos),cor:pick(cores),
      prazo:new Date(now+(rnd(9)-3)*D).toISOString().slice(0,10),obs:pick(obs),col,hist});
  }});
  return {criado:now,items};
}
if(!S||!Array.isArray(S.items)){S=seed();store.set(KEY,S);}
const save=()=>store.set(KEY,S);

// ─── utilitários ───
const today=()=>{const d=new Date();d.setHours(12,0,0,0);return d;};
const dayDiff=iso=>Math.round((new Date(iso+'T12:00:00')-today())/864e5);
function prio(it){if(it.col==='prontas')return 'normal';const d=dayDiff(it.prazo);return d<0?'late':d===0?'today':d===1?'tomorrow':'normal';}
function dueText(it){const d=dayDiff(it.prazo);if(d<0)return ['Atrasada '+(-d)+(d===-1?' dia':' dias'),'late'];if(d===0)return ['Hoje','today'];if(d===1)return ['Amanhã','tomorrow'];
  const x=new Date(it.prazo+'T12:00:00');return [x.toLocaleDateString('pt-PT',{weekday:'short',day:'numeric',month:'short'}),''];}
const since=it=>it.hist.length?it.hist[it.hist.length-1].quando:S.criado;
function dur(ms){const m=Math.max(0,Math.round(ms/6e4));if(m<60)return m+' min';const h=Math.floor(m/60);if(h<24)return h+' h'+(m%60&&h<10?' '+m%60+' min':'');const d=Math.floor(h/24);return d+' d '+(h%24)+' h';}
const colName=id=>(COLS.find(c=>c.id===id)||{}).t||id;
const fmt=t=>new Date(t).toLocaleString('pt-PT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
function avgTime(col){// tempo médio de quem já SAIU desta fase
  const v=[];S.items.forEach(it=>it.hist.forEach((h,k)=>{if(h.para===col&&it.hist[k+1])v.push(it.hist[k+1].quando-h.quando);}));
  return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;}
function toast(t){const b=$('toast');b.textContent=t;b.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>b.hidden=true,2600);}
const user=()=>$('user').value;

// ─── desenhar ───
function visible(){if(!query)return S.items;const q=query.toLowerCase();return S.items.filter(it=>it.cliente.startsWith(q)||it.obra.startsWith(q)||it.nome.toLowerCase().includes(q)||it.ref.toLowerCase().includes(q));}
function renderKpis(){
  const inProd=S.items.filter(i=>i.col!=='prontas'),jantes=a=>a.reduce((s,i)=>s+i.qtd,0);
  const late=S.items.filter(i=>i.col!=='prontas'&&dayDiff(i.prazo)<0);
  const tomorrow=S.items.filter(i=>dayDiff(i.prazo)===1),tomorrowReady=tomorrow.filter(i=>i.col==='prontas');
  const blocked=S.items.filter(i=>i.col==='bloqueadas');
  const avgs=FLOW.filter(c=>c!=='prontas').map(c=>[c,avgTime(c)]).filter(x=>x[1]!=null).sort((a,b)=>b[1]-a[1]);
  const box=$('kpis');box.replaceChildren();
  const k=(cls,v,l,small)=>{const d=el('div','kpi '+cls);const vv=el('div','v',String(v));if(small)vv.append(el('small','',small));d.append(vv,el('div','l',l));box.append(d);};
  k('gold',jantes(inProd),'jantes em produção',inProd.length+' obras');
  k('late',late.length,'obras atrasadas',jantes(late)+' jantes');
  k('ok',tomorrowReady.length,'prontas para amanhã','de '+tomorrow.length);
  k('block',blocked.length,'bloqueadas / problemas',jantes(blocked)+' jantes');
  k('',S.items.filter(i=>i.col==='prontas').length,'prontas para expedição',jantes(S.items.filter(i=>i.col==='prontas'))+' jantes');
  k('',avgs.length?dur(avgs[0][1]):'—','fase mais lenta (média)',avgs.length?colName(avgs[0][0]):'');
}
function card(it){
  const c=el('article','card p-'+prio(it));c.dataset.id=it.id;
  const r1=el('div','r1');r1.append(el('span','num','#'+it.obra),el('span','cli',it.cliente+' · '+it.nome));
  const r2=el('div','r2');const q=el('span','qty',String(it.qtd));q.append(el('small','',' × '+it.medida+'"'));r2.append(q,el('span','ref',it.ref));
  const tags=el('div','tags');it.tipos.forEach(t=>tags.append(el('span','tag '+t,t)));
  const [dt,dc]=dueText(it);const age=Date.now()-since(it);const avg=avgTime(it.col);
  const r3=el('div','r3');r3.append(el('span','due '+dc,'⏱ '+dt),el('span','age'+(avg&&age>avg*1.5?' slow':''),'aqui há '+dur(age)));
  c.append(r1,r2,tags,r3);attachDrag(c,it);return c;
}
function render(){
  renderKpis();const board=$('board');const keep=board.scrollLeft;board.replaceChildren();const items=visible();
  COLS.forEach(col=>{
    const mine=items.filter(i=>i.col===col.id).sort((a,b)=>({late:0,today:1,tomorrow:2,normal:3}[prio(a)]-{late:0,today:1,tomorrow:2,normal:3}[prio(b)])||a.prazo.localeCompare(b.prazo));
    const c=el('section','col'+(col.id==='bloqueadas'?' block-col':''));c.dataset.col=col.id;
    const h=el('div','colhead');const t=el('div','t');t.append(el('i','',col.i),document.createTextNode(col.t),el('span','n',String(mine.length)));
    const avg=avgTime(col.id);const s=el('div','s');s.append(el('span','',mine.reduce((a,i)=>a+i.qtd,0)+' jantes'+(col.s?' · '+col.s:'')),el('span','',avg&&col.id!=='prontas'?'média '+dur(avg):''));
    h.append(t,s);const list=el('div','cards');if(!mine.length)list.append(el('div','empty',query?'Nada com esta pesquisa':'Vazio'));mine.forEach(i=>list.append(card(i)));
    c.append(h,list);board.append(c);});
  board.scrollLeft=keep;
}

// ─── arrastar (rato e dedo) ───
let drag=null;
function attachDrag(node,it){
  node.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={it,node,x:e.clientX,y:e.clientY,started:false,id:e.pointerId,timer:null};
    // no ecrã tátil: segurar ~250 ms para pegar no cartão (deslizar na vertical continua a fazer scroll da coluna)
    if(e.pointerType!=='mouse')drag.timer=setTimeout(()=>{if(drag&&!drag.started)startDrag(e.clientX,e.clientY);},250);});
}
function startDrag(x,y){drag.started=true;try{drag.node.setPointerCapture(drag.id);}catch{}
  const g=drag.node.cloneNode(true);g.classList.add('ghost');document.body.append(g);drag.ghost=g;drag.node.classList.add('dragging');moveGhost(x,y);navigator.vibrate?.(15);}
function moveGhost(x,y){drag.ghost.style.left=(x-120)+'px';drag.ghost.style.top=(y-30)+'px';
  document.querySelectorAll('.col.over').forEach(c=>c.classList.remove('over'));const col=colAt(x,y);if(col&&col.dataset.col!==drag.it.col)col.classList.add('over');
  const b=$('board').getBoundingClientRect();if(x>b.right-60)$('board').scrollLeft+=18;else if(x<b.left+60)$('board').scrollLeft-=18;}
function colAt(x,y){const e=document.elementsFromPoint(x,y).find(n=>n.classList&&n.classList.contains('col'));return e||null;}
document.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.started){if(e.pointerType==='mouse'&&Math.hypot(dx,dy)>8)startDrag(e.clientX,e.clientY);else if(e.pointerType!=='mouse'&&Math.hypot(dx,dy)>10){clearTimeout(drag.timer);drag=null;}return;}
  e.preventDefault();moveGhost(e.clientX,e.clientY);},{passive:false});
document.addEventListener('pointerup',e=>{if(!drag)return;clearTimeout(drag.timer);const d=drag;drag=null;
  if(!d.started){openDetail(d.it);return;}
  d.ghost.remove();d.node.classList.remove('dragging');document.querySelectorAll('.col.over').forEach(c=>c.classList.remove('over'));
  const col=colAt(e.clientX,e.clientY);if(col&&col.dataset.col!==d.it.col)askMove(d.it,col.dataset.col);});
document.addEventListener('touchmove',e=>{if(drag&&drag.started)e.preventDefault();},{passive:false});  // enquanto arrasta, o ecrã não faz scroll
document.addEventListener('pointercancel',()=>{if(!drag)return;clearTimeout(drag.timer);if(drag.started){drag.ghost.remove();drag.node.classList.remove('dragging');}drag=null;});

// ─── confirmar movimento ───
function askMove(it,to){
  const d=$('confirm');d.replaceChildren();const h=el('div','dh');const t=el('h3','','Mudar de setor?');h.append(t);
  const b=el('div','db');const p=el('p');p.append('Obra ',el('b','','#'+it.obra),' ('+it.qtd+' × '+it.medida+'", '+it.nome+')');
  const p2=el('p');p2.append(el('b','',colName(it.col)),'  →  ',el('b','',colName(to)));
  b.append(p,p2,el('div','',''));const who=el('p','');who.style.cssText='font-size:13px;color:var(--muted)';who.textContent='Fica registado em nome de '+user()+', '+fmt(Date.now())+'.';b.append(who);
  let note=null;if(to==='bloqueadas'){note=el('textarea','note');note.placeholder='Qual é o problema? (obrigatório)';b.append(note);}
  const row=el('div','row');const no=el('button','btn','Cancelar');no.type='button';const yes=el('button','btn gold','Confirmar');yes.type='button';row.append(no,yes);b.append(row);
  no.onclick=()=>d.close();
  yes.onclick=()=>{if(note&&!note.value.trim()){note.focus();note.placeholder='Escreve o problema para poder bloquear.';return;}
    it.hist.push({de:it.col,para:to,quando:Date.now(),quem:user(),...(note?{nota:note.value.trim()}:{})});it.col=to;save();d.close();if($('detail').open)$('detail').close();render();toast('#'+it.obra+' → '+colName(to));};
  d.append(h,b);d.showModal();if(note)setTimeout(()=>note.focus(),50);
}

// ─── detalhe ───
function openDetail(it){
  const d=$('detail');d.replaceChildren();const h=el('div','dh');const t=el('h3','','#'+it.obra+' · '+it.nome);t.append(el('small','','Cliente '+it.cliente+' · '+it.ref));
  const x=el('button','x','✕');x.type='button';x.onclick=()=>d.close();h.append(t,x);
  const b=el('div','db');const ph=el('div','photos');for(let k=0;k<Math.min(it.qtd,3);k++)ph.append(el('div','','◎'));b.append(ph);
  const g=el('div','grid2');const [dt]=dueText(it);
  [['Setor atual',colName(it.col)],['Há quanto tempo aqui',dur(Date.now()-since(it))],['Jantes',it.qtd+' × '+it.medida+'"'],['Cor',it.cor],['Trabalho',it.tipos.join(' · ')],['Entrega',dt+' ('+new Date(it.prazo+'T12:00:00').toLocaleDateString('pt-PT')+')']]
    .forEach(([l,v])=>{const c=el('div');c.append(el('span','',l),document.createTextNode(v));g.append(c);});b.append(g);
  if(it.obs){b.append(el('h4','','OBSERVAÇÕES'),el('div','obs',it.obs));}
  const i=FLOW.indexOf(it.col),next=it.col==='bloqueadas'?null:FLOW[i+1];
  b.append(el('h4','','MOVER PARA'));const mv=el('div','moves');
  if(next){const n=el('button','next','→ '+colName(next));n.type='button';n.onclick=()=>askMove(it,next);mv.append(n);}
  COLS.filter(c=>c.id!==it.col&&c.id!==next).forEach(c=>{const bt=el('button','',c.t);bt.type='button';bt.onclick=()=>askMove(it,c.id);mv.append(bt);});b.append(mv);
  b.append(el('h4','','HISTÓRICO DE MOVIMENTOS'));const hs=el('div','hist');
  [...it.hist].reverse().forEach(m=>{const r=el('div');r.append(el('time','',fmt(m.quando)));const txt=el('span','',(m.de?colName(m.de)+' → ':'Entrou em ')+colName(m.para)+' · '+m.quem+(m.nota?' — '+m.nota:''));r.append(txt);hs.append(r);});
  b.append(hs);d.append(h,b);d.showModal();
}

// ─── arranque ───
USERS.forEach(u=>$('user').append(new Option(u,u)));const savedUser=store.get(UKEY);if(savedUser&&USERS.includes(savedUser))$('user').value=savedUser;
$('user').onchange=()=>store.set(UKEY,user());
$('q').oninput=e=>{query=e.target.value.trim();render();};
$('reset').onclick=()=>{if(confirm('Apagar os movimentos de teste e gerar dados novos?')){S=seed();save();render();toast('Dados de teste repostos.');}};
['detail','confirm'].forEach(id=>$(id).addEventListener('click',e=>{if(e.target===$(id))$(id).close();}));
render();setInterval(()=>{if(!drag&&!document.querySelector('dialog[open]'))render();},30000);  // atualiza os tempos
</script>
</body>
</html>
